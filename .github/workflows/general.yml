name: General tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0 # See https://corrode.dev/blog/tips-for-faster-ci-builds/

jobs:
  build_and_test:
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim-version: [v0.12.4]
        include:
          - os: ubuntu-latest
            nvim-version: v0.9.5
          - os: ubuntu-latest
            nvim-version: v0.10.4
          - os: ubuntu-latest
            nvim-version: v0.11.7
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      - name: Build Teamtype
        run: cargo build --profile test
      - run: nvim --version
      - name: Compile default tests
        run: cargo test --locked --no-default-features --no-run
      - name: Compile e2e fuzzer
        run: cargo test --locked --no-default-features --no-run --test fuzzer
      - name: Run default unit tests
        run: cargo test --locked --no-default-features -p teamtype
      - name: Run default e2e tests
        run: cargo test --locked --no-default-features -p e2e-tests
      - if: ${{ matrix.nvim-version == 'v0.12.4' }}
        name: Run e2e fuzzer
        # The fuzzer installs its own panic hook and a logging subscriber, and the test target
        # has `harness = false`, so nothing is captured unless we ask for it. Without a log
        # level, a failing run produces no output at all, which makes debugging it a guessing
        # game.
        #
        # The timeout here is only a backstop against a hard hang. The test bounds every one of
        # its own waits, so a stall should surface as a failure naming the stuck actor. This
        # needs to sit comfortably above the sum of those in-test bounds (four 5-minute phases
        # plus a 3-minute convergence phase, ~24 minutes worst case), otherwise the job gets
        # cancelled before the test's own diagnostic has a chance to print.
        env:
          RUST_LOG: teamtype=debug
        timeout-minutes: 30
        run: cargo test --locked --no-default-features -p e2e-tests --test fuzzer

  check_formatting:
    name: Check Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: --deny warnings
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal --component=clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features
